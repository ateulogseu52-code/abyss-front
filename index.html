
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ABYSS FRONT — Infantry</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#06131c;color:#e2faff;
  font-family:system-ui,sans-serif;touch-action:none
}
canvas{display:block;width:100%;height:100%}
#hud{
  position:fixed;top:10px;left:12px;right:12px;
  display:flex;justify-content:space-between;gap:8px;
  pointer-events:none;font-weight:800;
  text-shadow:0 2px 4px #000;font-size:14px
}
#hud small{
  display:block;color:#8abdc7;font-size:11px
}
#hp{
  width:100px;height:7px;background:#243b46;
  margin-top:5px;border-radius:4px;overflow:hidden
}
#hpbar{
  height:100%;width:100%;background:#ff6973
}
#joy{
  position:fixed;left:24px;bottom:32px;
  width:130px;height:130px;border-radius:50%;
  border:2px solid #79c8d17a;
  background:#3a8a9a22;touch-action:none
}
#knob{
  position:absolute;left:42px;top:42px;
  width:42px;height:42px;border-radius:50%;
  background:#8bdff0a8;
  box-shadow:0 0 16px #4ccfe866
}
#reload{
  position:fixed;right:25px;bottom:48px;
  width:86px;height:86px;border-radius:50%;
  border:2px solid #82d8e4;background:#17465ad9;
  color:white;font-weight:800;font-size:14px
}
#overlay{
  position:fixed;inset:0;background:#031019e8;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:24px
}
#overlay h1{
  font-size:clamp(32px,8vw,62px);
  letter-spacing:3px;color:#a4f1ff;margin:0 0 14px
}
#overlay p{
  color:#b1cdd3;line-height:1.8
}
#start{
  background:#167c95;border:1px solid #92e7f5;
  border-radius:8px;padding:14px 36px;
  color:white;font-size:19px;font-weight:800
}
#toast{
  position:fixed;top:24%;left:0;width:100%;
  text-align:center;color:#b6f6ff;font-size:25px;
  font-weight:900;text-shadow:0 0 14px #28bfe3;
  pointer-events:none;opacity:0
}
#hint{
  position:fixed;bottom:6px;left:0;right:0;
  text-align:center;font-size:10px;
  color:#8fb8c2;pointer-events:none
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div>
    소총병
    <small>생명력</small>
    <div id="hp"><div id="hpbar"></div></div>
  </div>
  <div style="text-align:center">
    WAVE <span id="wave">1</span>
    <small>처치 <span id="kills">0</span></small>
  </div>
  <div style="text-align:right">
    탄약 <span id="ammo">30 / ∞</span>
    <small id="status">자동 사격</small>
  </div>
</div>

<div id="joy"><div id="knob"></div></div>
<button id="reload">재장전</button>
<div id="toast"></div>
<div id="hint">
  조이스틱 / WASD 이동 · 자동 조준 · R 재장전
</div>

<div id="overlay">
  <div>
    <h1>ABYSS FRONT</h1>
    <p>
      심해에서 밀려오는 괴물을 막아라.<br>
      몸은 이동 방향으로, 총은 적을 향해 회전한다.<br>
      탄창이 비면 자동으로 재장전한다.
    </p>
    <button id="start">방어 개시</button>
  </div>
</div>

<script>
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('game');
const ctx=canvas.getContext('2d');

let W=0,H=0,D=1;
let playing=false,last=0,raf=0;
let time=0,wave=1,kills=0;
let spawnTimer=0,shake=0,toastTime=0;

let player=null;
let enemies=[],bullets=[],particles=[];

const keys=new Set();
const joy={x:0,y:0,id:null};

function resize(){
  D=Math.min(devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;
  canvas.width=Math.round(W*D);
  canvas.height=Math.round(H*D);
  ctx.setTransform(D,0,0,D,0,0);
}
addEventListener('resize',resize);
resize();

// JOYSTICK
const stick=$('joy');
const knob=$('knob');

function updateJoy(e){
  const r=stick.getBoundingClientRect();
  const dx=e.clientX-r.left-r.width/2;
  const dy=e.clientY-r.top-r.height/2;
  const dist=Math.hypot(dx,dy)||1;
  const power=Math.min(1,dist/45);

  joy.x=dx/dist*power;
  joy.y=dy/dist*power;

  knob.style.transform=
    `translate(${joy.x*43}px,${joy.y*43}px)`;
}

stick.addEventListener('pointerdown',e=>{
  if(joy.id!==null)return;
  joy.id=e.pointerId;
  stick.setPointerCapture(e.pointerId);
  updateJoy(e);
});

stick.addEventListener('pointermove',e=>{
  if(e.pointerId===joy.id)updateJoy(e);
});

function stopJoy(e){
  if(e.pointerId!==joy.id)return;
  joy.id=null;
  joy.x=joy.y=0;
  knob.style.transform='';
}

stick.addEventListener('pointerup',stopJoy);
stick.addEventListener('pointercancel',stopJoy);

// KEYBOARD
addEventListener('keydown',e=>{
  keys.add(e.key.toLowerCase());
  if(e.key.toLowerCase()==='r')reload();

  if(['ArrowUp','ArrowDown','ArrowLeft',
      'ArrowRight',' '].includes(e.key)){
    e.preventDefault();
  }
});

addEventListener('keyup',e=>{
  keys.delete(e.key.toLowerCase());
});

addEventListener('blur',()=>{
  keys.clear();
  joy.id=null;
  joy.x=joy.y=0;
  knob.style.transform='';
});

$('reload').onclick=reload;

// GAME
function reload(){
  if(!playing||!player||
     player.reload>0||player.ammo===30)return;

  player.reload=1.35;
  $('status').textContent='재장전 중';
}

function toast(text){
  $('toast').textContent=text;
  $('toast').style.opacity='1';
  toastTime=1.6;
}

function start(){
  if(raf)cancelAnimationFrame(raf);

  player={
    x:W/2,y:H/2,
    hp:100,ammo:30,
    reload:0,fire:0,aim:0,
    face:'down',walk:0,
    inv:0,moving:false
  };

  enemies=[];
  bullets=[];
  particles=[];
  time=0;
  wave=1;
  kills=0;
  spawnTimer=.65;
  shake=0;

  joy.x=joy.y=0;
  joy.id=null;
  knob.style.transform='';

  playing=true;
  $('overlay').style.display='none';
  $('status').textContent='자동 사격';

  toast('방어 개시');
  last=performance.now();
  raf=requestAnimationFrame(loop);
}

$('start').onclick=start;

function spawnEnemy(){
  const edge=Math.floor(Math.random()*4);
  const x=edge===0?-32:
    edge===1?W+32:Math.random()*W;
  const y=edge===2?-32:
    edge===3?H+32:Math.random()*H;

  const r=Math.random();
  const type=wave>=3&&r<.19?'brute':
    r<.48?'runner':'grunt';

  const base=type==='brute'?120:
    type==='runner'?25:48;
  const size=type==='brute'?23:
    type==='runner'?12:17;

  enemies.push({
    x,y,type,r:size,
    hp:base*(1+wave*.1),
    max:base*(1+wave*.1),
    speed:(type==='brute'?34:
      type==='runner'?102:55)*(1+wave*.035),
    attack:0,
    phase:Math.random()*7
  });
}

function burst(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const s=35+Math.random()*120;

    particles.push({
      x,y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:.2+Math.random()*.4,
      color
    });
  }
}

function gameOver(){
  playing=false;
  $('overlay').style.display='flex';
  $('overlay').querySelector('h1').textContent=
    '방어선 붕괴';
  $('overlay').querySelector('p').innerHTML=
    `최종 웨이브 ${wave}<br>격퇴한 괴물 ${kills}마리`;
  $('start').textContent='다시 도전';
}

function update(dt){
  time+=dt;

  const nextWave=1+Math.floor(time/24);
  if(nextWave!==wave){
    wave=nextWave;
    player.hp=Math.min(100,player.hp+12);
    toast('WAVE '+wave);
  }

  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnEnemy();
    spawnTimer=Math.max(.17,1.08-wave*.07)*
      (.7+Math.random()*.6);
  }

  // MOVEMENT
  let dx=joy.x+
    (keys.has('d')||keys.has('arrowright')?1:0)-
    (keys.has('a')||keys.has('arrowleft')?1:0);

  let dy=joy.y+
    (keys.has('s')||keys.has('arrowdown')?1:0)-
    (keys.has('w')||keys.has('arrowup')?1:0);

  let m=Math.hypot(dx,dy);
  if(m>1){
    dx/=m;
    dy/=m;
  }

  player.moving=m>.12;

  if(player.moving){
    player.face=Math.abs(dx)>Math.abs(dy)?
      (dx>0?'right':'left'):
      (dy>0?'down':'up');

    player.walk+=dt*12;
  }else{
    player.walk=0;
  }

  player.x=Math.max(
    22,Math.min(W-22,player.x+dx*210*dt)
  );
  player.y=Math.max(
    28,Math.min(H-24,player.y+dy*210*dt)
  );

  player.inv=Math.max(0,player.inv-dt);

  // RELOAD
  if(player.reload>0){
    player.reload-=dt;

    if(player.reload<=0){
      player.ammo=30;
      $('status').textContent='자동 사격';
    }
  }

  // TARGETING
  let target=null,best=Infinity;

  for(const e of enemies){
    const d=Math.hypot(
      e.x-player.x,e.y-player.y
    );

    if(d<best){
      best=d;
      target=e;
    }
  }

  if(target){
    player.aim=Math.atan2(
      target.y-player.y,
      target.x-player.x
    );
  }

  // AUTO FIRE
  player.fire-=dt;

  if(target&&best<Math.max(W,H)*.8&&
     player.fire<=0&&player.reload<=0){

    if(player.ammo<=0){
      reload();
    }else{
      player.ammo--;
      player.fire=.115;

      const a=player.aim+
        (Math.random()-.5)*.065;

      bullets.push({
        x:player.x+Math.cos(a)*24,
        y:player.y+Math.sin(a)*24,
        vx:Math.cos(a)*720,
        vy:Math.sin(a)*720,
        life:.8
      });

      burst(
        player.x+Math.cos(a)*26,
        player.y+Math.sin(a)*26,
        '#ffda70',3
      );

      if(player.ammo===0)reload();
    }
  }

  // BULLETS
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.life-=dt;

    let hit=false;

    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];

      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+3){
        e.hp-=24;
        hit=true;
        burst(b.x,b.y,'#66f0d4',4);

        if(e.hp<=0){
          kills++;
          burst(e.x,e.y,'#4ad8b1',13);
          enemies.splice(j,1);
        }
        break;
      }
    }

    if(hit||b.life<=0||
       b.x<0||b.x>W||b.y<0||b.y>H){
      bullets.splice(i,1);
    }
  }

  // ENEMIES
  for(const e of enemies){
    const a=Math.atan2(
      player.y-e.y,player.x-e.x
    );
    const dist=Math.hypot(
      player.x-e.x,player.y-e.y
    );

    e.phase+=dt*6;
    e.x+=Math.cos(a)*e.speed*dt;
    e.y+=Math.sin(a)*e.speed*dt;
    e.attack-=dt;

    if(dist<e.r+16&&e.attack<=0){
      e.attack=.8;

      if(player.inv<=0){
        player.hp-=e.type==='brute'?18:9;
        player.inv=.3;
        shake=8;

        burst(
          player.x,player.y,
          '#ff8585',8
        );

        if(player.hp<=0){
          gameOver();
          break;
        }
      }
    }
  }

  // PARTICLES
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.life-=dt;

    if(p.life<=0)particles.splice(i,1);
  }

  shake=Math.max(0,shake-40*dt);
  toastTime-=dt;

  if(toastTime<=0){
    $('toast').style.opacity='0';
  }

  $('hpbar').style.width=
    Math.max(0,player.hp)+'%';
  $('wave').textContent=wave;
  $('kills').textContent=kills;
  $('ammo').textContent=player.ammo+' / ∞';
}

// PIXEL SPRITE GENERATOR
// 4 directions x 4 walking frames
const spriteCanvas=document.createElement('canvas');
spriteCanvas.width=32*4;
spriteCanvas.height=40*4;

const sg=spriteCanvas.getContext('2d');
sg.imageSmoothingEnabled=false;

function pixel(g,x,y,w,h,color){
  g.fillStyle=color;
  g.fillRect(
    Math.round(x),Math.round(y),w,h
  );
}

function makeSprite(direction,frame){
  const x0=direction*32;
  const y0=frame*40;

  sg.save();
  sg.translate(x0,y0);

  const side=direction>=2;
  const back=direction===1;
  const left=direction===2;
  const step=[0,2,0,-2][frame];

  // BOOTS AND LEGS
  pixel(sg,10,28+step,5,9,'#1a2733');
  pixel(sg,18,28-step,5,9,'#1a2733');
  pixel(sg,9,34+step,7,3,'#405261');
  pixel(sg,18,34-step,7,3,'#405261');

  // TACTICAL TORSO
  pixel(sg,8,17,17,14,'#192630');
  pixel(sg,10,18,13,13,'#37434f');

  // ARMS
  pixel(sg,6,19,5,11,'#252c38');
  pixel(sg,23,19,5,11,'#252c38');
  pixel(sg,6,27,5,3,'#b8a7a4');
  pixel(sg,23,27,5,3,'#b8a7a4');

  // ARMOR
  pixel(
    sg,12,20,9,7,
    back?'#202c39':'#586472'
  );
  pixel(sg,12,28,9,2,'#e6a63d');

  // SILVER HAIR
  pixel(sg,11,6,13,14,'#c6bbd9');
  pixel(sg,12,5,10,3,'#f1e6fa');

  if(back){
    // BACK VIEW
    pixel(sg,13,12,11,13,'#b5a8d3');
    pixel(sg,16,22,7,6,'#8b82b6');
  }else if(side){
    // LEFT AND RIGHT VIEW
    pixel(
      sg,left?10:13,11,10,9,
      '#efc8b8'
    );
    pixel(
      sg,left?11:20,13,2,3,
      '#524b73'
    );
    pixel(
      sg,left?20:8,8,6,14,
      '#b3a6d1'
    );
  }else{
    // FRONT VIEW
    pixel(sg,12,12,10,8,'#edc7b9');
    pixel(sg,13,14,2,2,'#51496b');
    pixel(sg,20,14,2,2,'#51496b');
  }

  // HEADSET
  pixel(sg,9,9,4,10,'#303644');
  pixel(sg,23,9,4,10,'#303644');
  pixel(sg,10,9,2,5,'#efb341');
  pixel(sg,24,9,2,5,'#efb341');

  // HAIR HIGHLIGHTS
  pixel(sg,11,5,13,3,'#f4e9ff');
  pixel(sg,8,6,5,5,'#d6cbe6');
  pixel(sg,6,3,6,5,'#e1d7f0');
  pixel(sg,5,1,5,4,'#bfb2d9');

  sg.restore();
}

for(let d=0;d<4;d++){
  for(let f=0;f<4;f++){
    makeSprite(d,f);
  }
}

const faceRow={
  down:0,
  up:1,
  left:2,
  right:3
};

// DRAW SOLDIER
function drawSoldier(){
  const dir=faceRow[player.face]??0;
  const frame=player.moving?
    Math.floor(player.walk)%4:0;

  ctx.save();
  ctx.translate(player.x,player.y);

  ctx.globalAlpha=player.inv>0?.55:1;

  // SHADOW
  ctx.fillStyle='#020a10a0';
  ctx.beginPath();
  ctx.ellipse(
    0,15,17,6,0,0,Math.PI*2
  );
  ctx.fill();

  // CHARACTER SPRITE
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(
    spriteCanvas,
    dir*32,frame*40,32,40,
    -24,-29,48,60
  );

  // INDEPENDENT RIFLE
  ctx.rotate(player.aim);

  ctx.fillStyle='#17212b';
  ctx.fillRect(-9,-4,40,8);

  ctx.fillStyle='#73828e';
  ctx.fillRect(4,-5,20,3);

  ctx.fillStyle='#c5a05a';
  ctx.fillRect(11,-3,9,3);

  ctx.fillStyle='#1e2b37';
  ctx.fillRect(12,4,8,8);

  ctx.fillStyle='#9ba6ae';
  ctx.fillRect(28,-2,10,4);

  ctx.restore();
}

// DRAW GAME
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();

  if(shake){
    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  // FLOOR
  ctx.fillStyle='#0a202b';
  ctx.fillRect(0,0,W,H);

  // GRID
  ctx.strokeStyle='#294d5a70';
  ctx.lineWidth=1;

  for(let x=0;x<W;x+=60){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=0;y<H;y+=60){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  // BORDER
  ctx.strokeStyle='#377f90';
  ctx.lineWidth=7;
  ctx.strokeRect(5,5,W-10,H-10);

  // BULLETS
  for(const b of bullets){
    ctx.strokeStyle='#ffe3a0';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(
      b.x-b.vx*.022,
      b.y-b.vy*.022
    );
    ctx.stroke();
  }

  // SEA MONSTERS
  for(const e of enemies){
    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.rotate(
      Math.atan2(
        player.y-e.y,
        player.x-e.x
      )
    );

    ctx.fillStyle=
      e.type==='brute'?'#674767':
      e.type==='runner'?'#46918c':
      '#326e73';

    ctx.strokeStyle='#91dcc5';
    ctx.lineWidth=2;
    ctx.beginPath();

    for(let j=0;j<8;j++){
      const a=j*Math.PI/4;
      const r=e.r*(j%2?.8:1.15);

      if(j===0){
        ctx.moveTo(
          Math.cos(a)*r,
          Math.sin(a)*r
        );
      }else{
        ctx.lineTo(
          Math.cos(a)*r,
          Math.sin(a)*r
        );
      }
    }

    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // EYES
    ctx.fillStyle='#d0ffdd';
    ctx.fillRect(e.r*.2,-5,4,4);
    ctx.fillRect(e.r*.2,3,4,4);

    ctx.restore();

    // ENEMY HEALTH BAR
    if(e.hp<e.max){
      ctx.fillStyle='#23333c';
      ctx.fillRect(
        e.x-e.r,e.y-e.r-11,
        e.r*2,4
      );

      ctx.fillStyle='#8df0b7';
      ctx.fillRect(
        e.x-e.r,e.y-e.r-11,
        e.r*2*Math.max(0,e.hp/e.max),4
      );
    }
  }

  if(player)drawSoldier();

  // PARTICLES
  for(const p of particles){
    ctx.globalAlpha=Math.max(
      0,Math.min(1,p.life*3)
    );
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,3,3);
  }

  ctx.globalAlpha=1;
  ctx.restore();

  // VIGNETTE
  const v=ctx.createRadialGradient(
    W/2,H/2,Math.min(W,H)*.2,
    W/2,H/2,Math.max(W,H)*.8
  );

  v.addColorStop(0,'#0000');
  v.addColorStop(1,'#0009');

  ctx.fillStyle=v;
  ctx.fillRect(0,0,W,H);
}

// MAIN LOOP
function loop(now){
  raf=0;
  if(!playing)return;

  const dt=Math.min(
    .035,(now-last)/1000||.016
  );

  last=now;
  update(dt);
  draw();

  if(playing){
    raf=requestAnimationFrame(loop);
  }
}

draw();
</script>
</body>
</html>
